x-host-environment: &host_environment
  env_file:
    - ${HOST_ENV_FILE:-/etc/environment}

services:
  hex-iam:
    <<: *host_environment
    build:
      context: .
      target: runtime
    container_name: hex-iam
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - backend

  postgres:
    <<: *host_environment
    image: postgres:17
    container_name: hex-iam-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    networks:
      - backend

  redis:
    <<: *host_environment
    image: redis:7-alpine
    container_name: hex-iam-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: ["redis-server", "--aclfile", "/data/users.acl"]
    volumes:
      - redis_data:/data
      - ./users.acl:/data/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    networks:
      - backend

networks:
  backend:
    internal: true

volumes:
  redis_data:
  postgres_data:
