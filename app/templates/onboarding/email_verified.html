<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - {{ app_name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .logo { margin-bottom: 24px; }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .logo-icon svg { width: 36px; height: 36px; }
        .logo-text { color: #06b6d4; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
        .success-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: rgba(34, 197, 94, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(34, 197, 94, 0.24);
        }
        .success-icon svg { width: 32px; height: 32px; color: #4ade80; }
        h1 { color: #e2e8f0; font-size: 22px; font-weight: 600; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #0891b2;
            color: white;
            border: none;
        }
        .btn-primary:hover { background: #06b6d4; }
        .btn-secondary {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        .btn-secondary:hover { background: #334155; color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 5 L93.3 30 V80 L50 105 L6.7 80 V30 L50 5Z" fill="#0891b2" stroke="#06b6d4" stroke-width="0"/>
                    <path d="M44 25 H56 V43.5 C59.5 44.8 62 48.1 62 52 C62 57.5 57.5 62 52 62 H48 C42.5 62 38 57.5 38 52 C38 48.1 40.5 44.8 44 43.5 V25Z" fill="white"/>
                    <circle cx="25" cy="52" r="5" fill="white"/>
                    <circle cx="75" cy="52" r="5" fill="white"/>
                    <path d="M30 52 H38" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
                    <path d="M62 52 H70" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
                </svg>
                <span class="logo-text">HEXALGON</span>
            </div>
        </div>

        <div class="success-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <h1>Email Verified</h1>
        <p>{{ message }}</p>

        <div class="actions">
            <a href="/" class="btn btn-primary">Continue</a>
            <a href="/docs" class="btn btn-secondary">API Docs</a>
        </div>
    </div>
</body>
</html>
