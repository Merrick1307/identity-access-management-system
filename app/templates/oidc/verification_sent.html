<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email - Hexalgon IAM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 440px;
            text-align: center;
        }
        .logo { margin-bottom: 24px; }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .logo-icon svg { width: 36px; height: 36px; }
        .logo-text { color: #06b6d4; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
        .icon { 
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: rgba(6,182,212,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(6,182,212,0.2);
        }
        .icon svg { width: 28px; height: 28px; color: #06b6d4; }
        h1 { color: #e2e8f0; font-size: 22px; font-weight: 600; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
        .email { font-weight: 600; color: #06b6d4; }
        .note { background: #0f172a; padding: 16px; border-radius: 8px; font-size: 13px; color: #94a3b8; border: 1px solid #334155; }
        .note a { color: #06b6d4; text-decoration: none; font-weight: 500; }
        .note a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 5 L93.3 30 V80 L50 105 L6.7 80 V30 L50 5Z" fill="#0891b2" stroke="#06b6d4" stroke-width="0"/>
                    <path d="M44 25 H56 V43.5 C59.5 44.8 62 48.1 62 52 C62 57.5 57.5 62 52 62 H48 C42.5 62 38 57.5 38 52 C38 48.1 40.5 44.8 44 43.5 V25Z" fill="white"/>
                    <circle cx="25" cy="52" r="5" fill="white"/>
                    <circle cx="75" cy="52" r="5" fill="white"/>
                    <path d="M30 52 H38" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
                    <path d="M62 52 H70" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
                </svg>
                <span class="logo-text">HEXALGON</span>
            </div>
        </div>
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        </div>
        <h1>Check Your Email</h1>
        <p>We've sent a verification link to<br><span class="email">{{ email }}</span></p>
        <p>Click the link in the email to verify your account and complete your registration.</p>
        <div class="note">
            Didn't receive the email? Check your spam folder or <a href="#">resend verification</a>
        </div>
    </div>
</body>
</html>
