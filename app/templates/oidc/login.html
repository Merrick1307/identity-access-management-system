<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - {{ client_name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .logo-icon svg { width: 40px; height: 40px; }
        .logo-text { color: #06b6d4; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
        .logo p { color: #94a3b8; font-size: 13px; margin-top: 4px; }
        .client-info {
            background: #0f172a;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        .client-info strong { color: #e2e8f0; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #cbd5e1; font-weight: 500; font-size: 14px; }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            color: #e2e8f0;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: #64748b; }
        input:focus { outline: none; border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6,182,212,0.15); }
        .btn {
            width: 100%;
            padding: 12px 16px;
            background: #0891b2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover { background: #06b6d4; }
        .error { background: rgba(239,68,68,0.1); color: #f87171; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; border: 1px solid rgba(239,68,68,0.3); }
        .signup-link { text-align: center; margin-top: 20px; color: #94a3b8; font-size: 14px; }
        .signup-link a { color: #06b6d4; text-decoration: none; font-weight: 500; }
        .signup-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 5 L93.3 30 V80 L50 105 L6.7 80 V30 L50 5Z" fill="#0891b2" stroke="#06b6d4" stroke-width="0"/>
                    <path d="M44 25 H56 V43.5 C59.5 44.8 62 48.1 62 52 C62 57.5 57.5 62 52 62 H48 C42.5 62 38 57.5 38 52 C38 48.1 40.5 44.8 44 43.5 V25Z" fill="white"/>
                    <circle cx="25" cy="52" r="5" fill="white"/>
                    <circle cx="75" cy="52" r="5" fill="white"/>
                    <path d="M30 52 H38" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
                    <path d="M62 52 H70" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
                </svg>
                <span class="logo-text">HEXALGON</span>
            </div>
            <p>Identity & Access Management</p>
        </div>
        <div class="client-info">
            Signing in to <strong>{{ client_name }}</strong>
        </div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/api/v1/oidc/login">
            <input type="hidden" name="client_id" value="{{ client_id }}">
            <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
            <input type="hidden" name="response_type" value="{{ response_type }}">
            <input type="hidden" name="scope" value="{{ scope }}">
            <input type="hidden" name="state" value="{{ state or '' }}">
            <input type="hidden" name="nonce" value="{{ nonce or '' }}">
            <input type="hidden" name="code_challenge" value="{{ code_challenge or '' }}">
            <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method or '' }}">
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <div class="signup-link">
            Don't have an account? <a href="/api/v1/oidc/signup?client_id={{ client_id }}&redirect_uri={{ redirect_uri }}">Sign up</a>
        </div>
    </div>
</body>
</html>
