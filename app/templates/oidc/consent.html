<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize - {{ client_name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            padding: 32px;
            width: 100%;
            max-width: 440px;
        }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .logo-icon svg { width: 36px; height: 36px; }
        .logo-text { color: #06b6d4; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #e2e8f0; font-size: 18px; font-weight: 600; margin-bottom: 6px; }
        .user-info { color: #94a3b8; font-size: 14px; }
        .user-info strong { color: #e2e8f0; }
        .client-card {
            background: #0f172a;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .client-card h2 { font-size: 16px; color: #e2e8f0; margin-bottom: 4px; font-weight: 600; }
        .client-card p { color: #94a3b8; font-size: 14px; }
        .permissions { margin-bottom: 24px; }
        .permissions h3 { font-size: 12px; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
        .permissions ul { list-style: none; }
        .permissions li {
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            margin-bottom: 6px;
            border-radius: 8px;
            font-size: 13px;
            color: #cbd5e1;
        }
        .permissions li strong { color: #e2e8f0; }
        .buttons { display: flex; gap: 12px; }
        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-allow {
            background: #0891b2;
            color: white;
        }
        .btn-allow:hover { background: #06b6d4; }
        .btn-deny {
            background: #334155;
            color: #94a3b8;
            border: 1px solid #475569;
        }
        .btn-deny:hover { background: #475569; color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 5 L93.3 30 V80 L50 105 L6.7 80 V30 L50 5Z" fill="#0891b2" stroke="#06b6d4" stroke-width="0"/>
                    <path d="M44 25 H56 V43.5 C59.5 44.8 62 48.1 62 52 C62 57.5 57.5 62 52 62 H48 C42.5 62 38 57.5 38 52 C38 48.1 40.5 44.8 44 43.5 V25Z" fill="white"/>
                    <circle cx="25" cy="52" r="5" fill="white"/>
                    <circle cx="75" cy="52" r="5" fill="white"/>
                    <path d="M30 52 H38" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
                    <path d="M62 52 H70" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
                </svg>
                <span class="logo-text">HEXALGON</span>
            </div>
        </div>
        <div class="header">
            <h1>Authorization Request</h1>
            <p class="user-info">Signed in as <strong>{{ user_email }}</strong></p>
        </div>
        <div class="client-card">
            <h2>{{ client_name }}</h2>
            <p>wants to access your account</p>
        </div>
        <div class="permissions">
            <h3>This will allow the application to:</h3>
            <ul>
                {% for scope_item in scope_items %}
                <li><strong>{{ scope_item.name }}</strong>: {{ scope_item.description }}</li>
                {% endfor %}
            </ul>
        </div>
        <form method="POST" action="/api/v1/oidc/consent">
            <input type="hidden" name="client_id" value="{{ client_id }}">
            <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
            <input type="hidden" name="response_type" value="{{ response_type }}">
            <input type="hidden" name="scope" value="{{ scope }}">
            <input type="hidden" name="state" value="{{ state or '' }}">
            <input type="hidden" name="nonce" value="{{ nonce or '' }}">
            <input type="hidden" name="code_challenge" value="{{ code_challenge or '' }}">
            <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method or '' }}">
            
            <div class="buttons">
                <button type="submit" name="action" value="deny" class="btn btn-deny">Deny</button>
                <button type="submit" name="action" value="allow" class="btn btn-allow">Allow</button>
            </div>
        </form>
    </div>
</body>
</html>
